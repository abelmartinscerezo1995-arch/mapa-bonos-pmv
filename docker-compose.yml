# Mapa de los bonos en el servidor (mismo sistema que el traductor del manual de ventas).
#   Primera vez:   git clone https://github.com/abelmartinscerezo1995-arch/mapa-bonos-pmv.git && cd mapa-bonos-pmv && docker compose up -d
#   Actualizar:    git pull        (no hace falta reiniciar: nginx sirve la carpeta directamente)
# Queda en http://SERVIDOR:8503/ . Para meterlo en grandvalira.com hace falta HTTPS (ver docs/PLAN.md).
services:
  mapa-bonos:
    image: nginx:1.27-alpine
    container_name: mapa-bonos
    ports:
      - "8503:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
