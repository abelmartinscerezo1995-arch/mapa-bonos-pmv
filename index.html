<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu pack en el mapa</title>
<meta name="description" content="Escuela, restaurantes y tiendas de alquiler de tu pack de esquí, en el mapa.">
<meta name="theme-color" content="#0b2b4c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230a6ebd' d='m15 4-6-2-7 2.5V22l7-2.5 6 2 7-2.5V2zm-1 15.6-4-1.3V4.4l4 1.3z'/%3E%3C/svg%3E">
<link rel="preload" href="vendor/leaflet/leaflet.js" as="script">
<link rel="preload" href="datos.js" as="script">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #f3f5f8; color: #16202b; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-text-size-adjust: 100%; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  main { flex: 1; min-height: 0; padding-bottom: env(safe-area-inset-bottom); }
  noscript p { padding: 24px; }
  /* Lo que se ve mientras carga el script (misma altura que la cabecera real: la página no salta) */
  .esqueleto { height: 100%; display: flex; flex-direction: column; }
  .esqueleto div { height: 60px; background: #0b2b4c; flex: none; padding: 18px 16px; }
  .esqueleto svg { width: 24px; height: 24px; opacity: .6; }
  .esqueleto span { margin: auto; width: 28px; height: 28px; border: 3px solid #dde3ea; border-top-color: #0a6ebd; border-radius: 50%; animation: giro .8s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<!-- Página del QR: solo un envoltorio. Todo lo pinta mapa-bonos.js (el mismo script que se inserta en otras webs).
     Ejemplo: index.html?e=GV&s=cma&m=self   ·   e = estación, s = servicios (c clases, m menú, a alquiler), m = menú, l = idioma -->
<main><div data-mapa-bonos data-modo="pagina"><div class="esqueleto"><div><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="m15 4-6-2-7 2.5V22l7-2.5 6 2 7-2.5V2zm-1 15.6-4-1.3V4.4l4 1.3z"/></svg></div><span></span></div></div></main>
<noscript><p>Para ver el mapa hace falta activar JavaScript.</p></noscript>
<script src="vendor/leaflet/leaflet.js" defer></script>
<script src="datos.js" defer></script>
<script src="mapa-bonos.js" defer></script>
</body>
</html>
