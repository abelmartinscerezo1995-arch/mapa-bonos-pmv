# Servidor del mapa de los bonos (nginx dentro de Docker; ver docker-compose.yml en la raíz).
# Sirve la carpeta del repositorio tal cual: para actualizar basta con "git pull" en el servidor.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Lo que no es web no se publica (scripts, documentación, configuración, git).
    location ~ ^/(herramientas|deploy|docs)(/|$) { return 404; }
    location ~ /\.                                { return 404; }
    location ~ \.(py|md|bat|ya?ml|xlsx|pdf)$      { return 404; }

    # Planos y librerías: cambian poco (cada temporada los planos van a una carpeta nueva).
    location ^~ /planos/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /vendor/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Datos y script del mapa: 5 minutos, para que los cambios del Excel lleguen enseguida.
    location ~ \.js$ {
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Páginas: siempre la última versión. Se pueden meter en iframes de cualquier web (no hay datos privados).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
}
